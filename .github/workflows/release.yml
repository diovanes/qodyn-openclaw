name: Release prompts

on:
  push:
    tags:
      - "prompts-v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-prompts-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify tag matches manifest version
        run: |
          VERSION="$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('manifest.json','utf8')).release.version)")"
          EXPECTED="prompts-v${VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${EXPECTED}." >&2
            exit 1
          fi

      - name: Run full validation suite
        run: npm run check

      - name: Create release package
        run: npm run package

      - name: Resolve package metadata
        id: package
        run: |
          VERSION="$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('manifest.json','utf8')).release.version)")"
          FILE="artifacts/openclaw-prompts-${VERSION}.tar.gz"
          test -f "${FILE}"
          test -f "${FILE}.sha256"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file=${FILE}" >> "$GITHUB_OUTPUT"
          echo "checksum=${FILE}.sha256" >> "$GITHUB_OUTPUT"

      - name: Attest package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.file }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenClaw prompts v${{ steps.package.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.file }}
            ${{ steps.package.outputs.checksum }}

      - name: Upload release package to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-prompts-release-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.file }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 90
