name: Roll back OpenClaw workspace

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        required: true
        default: staging
        type: choice
        options: [staging, production]
      agent:
        description: Deployable agent
        required: true
        default: main
        type: choice
        options: [main, mpp_isis]
      backup_id:
        description: Backup ID (leave blank to use LATEST)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rollback-openclaw-workspace-${{ inputs.environment }}-${{ inputs.agent }}
  cancel-in-progress: false

env:
  REMOTE_ROOT: /tmp/openclaw-workspace-rollback-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.agent }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Copy rollback tools to the target host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.OPENCLAW_SSH_HOST }}
          username: ${{ vars.OPENCLAW_SSH_USER }}
          key: ${{ secrets.OPENCLAW_SSH_KEY }}
          port: ${{ vars.OPENCLAW_SSH_PORT || 22 }}
          source: scripts/common.sh,scripts/list-backups.sh,scripts/rollback.sh
          target: ${{ env.REMOTE_ROOT }}

      - name: List and restore the requested backup
        uses: appleboy/ssh-action@v1.2.5
        env:
          AGENT: ${{ inputs.agent }}
          BACKUP_ID: ${{ inputs.backup_id }}
          REMOTE_ROOT: ${{ env.REMOTE_ROOT }}
          OPENCLAW_WORKSPACE_ROOT: ${{ vars.OPENCLAW_WORKSPACE_ROOT }}
          OPENCLAW_BACKUP_ROOT: ${{ vars.OPENCLAW_BACKUP_ROOT }}
          OPENCLAW_BIN: ${{ vars.OPENCLAW_BIN }}
          OPENCLAW_RUN_CONFIG_VALIDATE: ${{ vars.OPENCLAW_RUN_CONFIG_VALIDATE }}
        with:
          host: ${{ vars.OPENCLAW_SSH_HOST }}
          username: ${{ vars.OPENCLAW_SSH_USER }}
          key: ${{ secrets.OPENCLAW_SSH_KEY }}
          port: ${{ vars.OPENCLAW_SSH_PORT || 22 }}
          envs: AGENT,BACKUP_ID,REMOTE_ROOT,OPENCLAW_WORKSPACE_ROOT,OPENCLAW_BACKUP_ROOT,OPENCLAW_BIN,OPENCLAW_RUN_CONFIG_VALIDATE
          script: |
            set -eu
            trap 'rm -rf "$REMOTE_ROOT"' EXIT
            TOOLS_DIR="$(dirname "$(find "$REMOTE_ROOT" -type f -name rollback.sh -print -quit)")"
            "$TOOLS_DIR/list-backups.sh" --agent "$AGENT"
            if [ -n "$BACKUP_ID" ]; then
              "$TOOLS_DIR/rollback.sh" --agent "$AGENT" --backup "$BACKUP_ID"
            else
              "$TOOLS_DIR/rollback.sh" --agent "$AGENT" --latest
            fi
            BIN="${OPENCLAW_BIN:-openclaw}"
            if command -v "$BIN" >/dev/null && [ "${OPENCLAW_RUN_CONFIG_VALIDATE:-true}" = true ]; then
              "$BIN" config validate
            fi
