name: Validate prompts

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "agents/**"
      - "config/**"
      - "docs/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "manifest.json"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main, develop]
    paths:
      - "agents/**"
      - "config/**"
      - "docs/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "manifest.json"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: validate-prompts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Lint, validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Markdown lint
        run: npm run lint:md

      - name: Validate project
        run: npm run validate

      - name: Run prompt policy tests
        run: npm run test:prompts

      - name: Validate shell scripts
        run: npm run test:shell

      - name: Scan repository for secrets
        run: npm run scan:secrets

      - name: Build release candidate
        run: npm run build

      - name: Verify generated checksums
        run: |
          cd dist
          sha256sum --check SHA256SUMS

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-prompts-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
