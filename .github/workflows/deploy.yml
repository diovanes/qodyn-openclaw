name: Deploy OpenClaw workspace

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag, or branch to deploy. The package is built once from this ref.
        required: true
        default: main
        type: string
      agent:
        description: Deployable agent
        required: true
        default: main
        type: choice
        options: [main, mpp_isis]

permissions:
  contents: read

concurrency:
  group: deploy-openclaw-workspace-${{ inputs.agent }}
  cancel-in-progress: false

env:
  REMOTE_ROOT: /tmp/openclaw-workspace-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.agent }}

jobs:
  staging:
    name: Build and deploy to staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    outputs:
      package_name: ${{ steps.package.outputs.package_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and validate
        run: |
          npm ci --ignore-scripts
          npm run check

      - name: Package the selected agent once
        id: package
        env:
          AGENT: ${{ inputs.agent }}
        run: |
          npm run package -- --agent "$AGENT"
          PACKAGE="$(find artifacts -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$PACKAGE"
          test -f "$PACKAGE.sha256"
          echo "package_name=$(basename "$PACKAGE")" >> "$GITHUB_OUTPUT"

      - name: Preserve the verified package for production
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-workspace-${{ github.run_id }}-${{ inputs.agent }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

      - name: Copy package to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.OPENCLAW_SSH_HOST }}
          username: ${{ vars.OPENCLAW_SSH_USER }}
          key: ${{ secrets.OPENCLAW_SSH_KEY }}
          port: ${{ vars.OPENCLAW_SSH_PORT || 22 }}
          source: artifacts/
          target: ${{ env.REMOTE_ROOT }}

      - name: Install and validate staging
        uses: appleboy/ssh-action@v1.0.3
        env:
          AGENT: ${{ inputs.agent }}
          ENVIRONMENT: staging
          REMOTE_ROOT: ${{ env.REMOTE_ROOT }}
          OPENCLAW_WORKSPACE_ROOT: ${{ vars.OPENCLAW_WORKSPACE_ROOT }}
          OPENCLAW_BACKUP_ROOT: ${{ vars.OPENCLAW_BACKUP_ROOT }}
          OPENCLAW_BIN: ${{ vars.OPENCLAW_BIN }}
          OPENCLAW_RUN_CONFIG_VALIDATE: ${{ vars.OPENCLAW_RUN_CONFIG_VALIDATE }}
          OPENCLAW_RUN_SECURITY_AUDIT: ${{ vars.OPENCLAW_RUN_SECURITY_AUDIT }}
          OPENCLAW_RUN_DEEP_SECURITY_AUDIT: ${{ vars.OPENCLAW_RUN_DEEP_SECURITY_AUDIT }}
          OPENCLAW_RUN_GATEWAY_STATUS: ${{ vars.OPENCLAW_RUN_GATEWAY_STATUS }}
          OPENCLAW_RUN_AGENTS_LIST: ${{ vars.OPENCLAW_RUN_AGENTS_LIST }}
        with:
          host: ${{ vars.OPENCLAW_SSH_HOST }}
          username: ${{ vars.OPENCLAW_SSH_USER }}
          key: ${{ secrets.OPENCLAW_SSH_KEY }}
          port: ${{ vars.OPENCLAW_SSH_PORT || 22 }}
          envs: AGENT,ENVIRONMENT,REMOTE_ROOT,OPENCLAW_WORKSPACE_ROOT,OPENCLAW_BACKUP_ROOT,OPENCLAW_BIN,OPENCLAW_RUN_CONFIG_VALIDATE,OPENCLAW_RUN_SECURITY_AUDIT,OPENCLAW_RUN_DEEP_SECURITY_AUDIT,OPENCLAW_RUN_GATEWAY_STATUS,OPENCLAW_RUN_AGENTS_LIST
          script: |
            set -eu
            trap 'rm -rf "$REMOTE_ROOT"' EXIT
            ARCHIVE="$(find "$REMOTE_ROOT" -type f -name '*.tar.gz' -print -quit)"
            test -n "$ARCHIVE"
            test -f "$ARCHIVE.sha256"
            (cd "$(dirname "$ARCHIVE")" && sha256sum --check "$(basename "$ARCHIVE").sha256")
            RELEASE="$REMOTE_ROOT/release"
            mkdir -p "$RELEASE"
            tar -xzf "$ARCHIVE" -C "$RELEASE"
            "$RELEASE/scripts/deploy.sh" --release "$RELEASE" --environment "$ENVIRONMENT" --agent "$AGENT"
            "$RELEASE/scripts/smoke-test.sh" --release "$RELEASE" --environment "$ENVIRONMENT" --agent "$AGENT"

  production:
    name: Promote the same package to production
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Download the package deployed to staging
        uses: actions/download-artifact@v4
        with:
          name: openclaw-workspace-${{ github.run_id }}-${{ inputs.agent }}
          path: artifacts

      - name: Verify package checksum before transport
        run: |
          ARCHIVE="$(find artifacts -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$ARCHIVE"
          (cd "$(dirname "$ARCHIVE")" && sha256sum --check "$(basename "$ARCHIVE").sha256")

      - name: Copy the staged package to production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.OPENCLAW_SSH_HOST }}
          username: ${{ vars.OPENCLAW_SSH_USER }}
          key: ${{ secrets.OPENCLAW_SSH_KEY }}
          port: ${{ vars.OPENCLAW_SSH_PORT || 22 }}
          source: artifacts/
          target: ${{ env.REMOTE_ROOT }}

      - name: Install and validate production
        uses: appleboy/ssh-action@v1.0.3
        env:
          AGENT: ${{ inputs.agent }}
          ENVIRONMENT: production
          REMOTE_ROOT: ${{ env.REMOTE_ROOT }}
          OPENCLAW_WORKSPACE_ROOT: ${{ vars.OPENCLAW_WORKSPACE_ROOT }}
          OPENCLAW_BACKUP_ROOT: ${{ vars.OPENCLAW_BACKUP_ROOT }}
          OPENCLAW_BIN: ${{ vars.OPENCLAW_BIN }}
          OPENCLAW_RUN_CONFIG_VALIDATE: ${{ vars.OPENCLAW_RUN_CONFIG_VALIDATE }}
          OPENCLAW_RUN_SECURITY_AUDIT: ${{ vars.OPENCLAW_RUN_SECURITY_AUDIT }}
          OPENCLAW_RUN_DEEP_SECURITY_AUDIT: ${{ vars.OPENCLAW_RUN_DEEP_SECURITY_AUDIT }}
          OPENCLAW_RUN_GATEWAY_STATUS: ${{ vars.OPENCLAW_RUN_GATEWAY_STATUS }}
          OPENCLAW_RUN_AGENTS_LIST: ${{ vars.OPENCLAW_RUN_AGENTS_LIST }}
        with:
          host: ${{ vars.OPENCLAW_SSH_HOST }}
          username: ${{ vars.OPENCLAW_SSH_USER }}
          key: ${{ secrets.OPENCLAW_SSH_KEY }}
          port: ${{ vars.OPENCLAW_SSH_PORT || 22 }}
          envs: AGENT,ENVIRONMENT,REMOTE_ROOT,OPENCLAW_WORKSPACE_ROOT,OPENCLAW_BACKUP_ROOT,OPENCLAW_BIN,OPENCLAW_RUN_CONFIG_VALIDATE,OPENCLAW_RUN_SECURITY_AUDIT,OPENCLAW_RUN_DEEP_SECURITY_AUDIT,OPENCLAW_RUN_GATEWAY_STATUS,OPENCLAW_RUN_AGENTS_LIST
          script: |
            set -eu
            trap 'rm -rf "$REMOTE_ROOT"' EXIT
            ARCHIVE="$(find "$REMOTE_ROOT" -type f -name '*.tar.gz' -print -quit)"
            test -n "$ARCHIVE"
            test -f "$ARCHIVE.sha256"
            (cd "$(dirname "$ARCHIVE")" && sha256sum --check "$(basename "$ARCHIVE").sha256")
            RELEASE="$REMOTE_ROOT/release"
            mkdir -p "$RELEASE"
            tar -xzf "$ARCHIVE" -C "$RELEASE"
            "$RELEASE/scripts/deploy.sh" --release "$RELEASE" --environment "$ENVIRONMENT" --agent "$AGENT"
            "$RELEASE/scripts/smoke-test.sh" --release "$RELEASE" --environment "$ENVIRONMENT" --agent "$AGENT"
